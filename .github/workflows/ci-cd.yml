name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install flake8
      run: python -m pip install --upgrade pip flake8

    - name: Check syntax and undefined names
      run: |
        cd backend
        flake8 . --exclude=venv,.venv,node_modules,__pycache__,build,dist --count --select=E9,F63,F7,F82 --show-source --statistics

  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt

    - name: Run offline tests
      env:
        MONGODB_URL: mongodb://localhost:27017/test_dbcsrc
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        OPENAI_API_KEY: test-key
        DEBUG: true
      run: |
        cd backend
        pytest scheduled_pull_test.py web_crawler_fetch_test.py extractamount_test.py llm_client_test.py mongo_upsert_test.py doc2text_ocr_test.py -q
